<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão · DB Barbearia</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#102A1E">
<link rel="icon" href="assets/marca/selo-verde.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Libre+Caslon+Text:wght@400;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="dados.js"></script>
<style>
:root {
  --night: #102A1E; --navy: #1B3F2D; --navy-2: #234C38; --navy-3: #2C5842; --silver: #D2D2D2; --mist: #C3D2C9; --paper: #F2F5F3;
  --lav: #8AD7B0; --lav-2: #A7E3C5; --ok: #8FD3A8; --warn: #F2B8A0; --rule: rgba(210, 210, 210, .16); --rule-2: rgba(210, 210, 210, .3);
  --display: "Big Shoulders Display", "Arial Narrow", sans-serif; --serif: "Libre Caslon Text", Georgia, serif; --ui: "Manrope", system-ui, sans-serif;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --slot: 44px; /* height of 30 minutes in the day grid */
  font-size: 100%;
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--night); color: var(--paper); font: 400 .9375rem/1.55 var(--ui); -webkit-font-smoothing: antialiased; }
img { display: block; max-width: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--lav-2); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -80px; z-index: 100; background: var(--paper); color: var(--night); padding: 12px 16px; font-weight: 700; }
.skip:focus { top: 12px; }
.eyebrow { font: 700 .75rem/1.3 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--lav-2); margin: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px solid var(--rule-2); background: transparent;
  font: 700 .875rem/1 var(--ui); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--lav); }
.btn.solid { background: var(--lav); border-color: var(--lav); color: var(--night); }
.btn.solid:hover { background: var(--lav-2); }
.btn.ok { border-color: var(--ok); color: var(--ok); }
.btn.warn { border-color: var(--warn); color: var(--warn); }
.btn svg { width: 18px; height: 18px; }

/* ---------- layout: sidebar (desktop) + tab bar (phone) ---------- */
.app { display: grid; min-height: 100vh; }
@media (min-width: 960px) { .app { grid-template-columns: 232px minmax(0, 1fr); } }
.side { display: none; }
@media (min-width: 960px) {
  .side { display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; padding: 18px 14px; border-right: 1px solid var(--rule); background: var(--navy); }
}
.side .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; font: 700 .9375rem/1.1 var(--ui); letter-spacing: .14em; text-transform: uppercase; }
.side .brand img { width: 38px; height: 38px; }
.side .brand small { display: block; font: 600 .6875rem/1 var(--ui); letter-spacing: .08em; color: var(--mist); text-transform: none; margin-top: 3px; }
.nav-a { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; text-decoration: none; color: var(--mist); font-weight: 600; border: 1px solid transparent; }
.nav-a svg { width: 20px; height: 20px; flex: none; }
.nav-a:hover { color: var(--paper); background: rgba(138, 215, 176, .08); }
.nav-a[aria-current="page"] { color: var(--paper); background: rgba(138, 215, 176, .16); border-color: rgba(138, 215, 176, .4); }
.nav-a .soon { margin-left: auto; font: 700 .625rem/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--mist); border: 1px solid var(--rule-2); padding: 4px 6px; }
.side .foot { margin-top: auto; font-size: .75rem; color: var(--mist); padding: 8px; }
.side .foot button { background: none; border: 0; color: var(--lav-2); text-decoration: underline; cursor: pointer; padding: 4px 0; font-size: .75rem; }

.main { min-width: 0; padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
@media (min-width: 960px) { .main { padding-bottom: 32px; } }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; background: rgba(16, 42, 30, .94);
  border-bottom: 1px solid var(--rule); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
@media (min-width: 960px) { .top { padding: 14px 28px; } }
.top h1 { margin: 0 auto 0 0; font: 800 1.9rem/1 var(--display); text-transform: uppercase; }
.top .mlogo { width: 32px; height: 32px; }
@media (min-width: 960px) { .top .mlogo { display: none; } }
.seg { display: inline-flex; border: 1px solid var(--rule-2); }
.seg button { min-height: 40px; padding: 0 12px; background: none; border: 0; cursor: pointer; font-weight: 700; font-size: .8125rem; color: var(--mist); }
.seg button + button { border-left: 1px solid var(--rule-2); }
.seg button[aria-pressed="true"] { background: var(--lav); color: var(--night); }
.view-as { display: flex; align-items: center; gap: 8px; font-size: .75rem; color: var(--mist); }
.content { padding: 18px 16px; display: grid; gap: 18px; }
@media (min-width: 960px) { .content { padding: 24px 28px; } }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  background: rgba(16, 42, 30, .97); border-top: 1px solid var(--rule-2); }
@media (min-width: 960px) { .tabbar { display: none; } }
.tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 56px; color: var(--mist); text-decoration: none; font: 700 .75rem/1 var(--ui); position: relative; }
.tabbar svg { width: 24px; height: 24px; }
.tabbar a[aria-current="page"] { color: var(--paper); }
.tabbar a[aria-current="page"]::before { content: ""; position: absolute; top: -6px; left: 30%; right: 30%; height: 3px; background: var(--lav); }

/* ---------- cards ---------- */
.panel { background: var(--navy); border: 1px solid var(--rule-2); padding: 18px; }
.panel > h2, .ph { font: 700 .75rem/1.3 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--lav-2); margin: 0 0 12px; }
.ph-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.ph-row .ph { margin: 0 auto 0 0; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 700px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpi { background: var(--navy); border: 1px solid var(--rule-2); padding: 14px 16px; }
.kpi b { display: block; font: 800 2.2rem/1 var(--display); }
.kpi span { color: var(--mist); font-size: .8125rem; }
.kpi.alert b { color: var(--warn); }
.closed-note { margin: 0; padding: 12px 14px; border-left: 3px solid var(--lav); background: rgba(138, 215, 176, .1); }
.closed-note[hidden] { display: none; }
.split { display: grid; gap: 18px; }
@media (min-width: 1560px) { .split { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; } }
@media (min-width: 960px) and (max-width: 1559px) { .col-side { grid-template-columns: 1fr 1fr; } }
.pend { list-style: none; margin: 0; padding: 0; }
.pend li + li { border-top: 1px solid var(--rule); }
.pend button { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 52px; padding: 8px 0; background: none; border: 0; text-align: left; cursor: pointer; }
.pend b { font: 800 1.4rem/1 var(--display); color: var(--lav-2); min-width: 28px; }
.pend small { color: var(--mist); }
.pend .chev { width: 16px; height: 16px; color: var(--mist); }
.nextcard { display: grid; gap: 6px; }
.nextcard .t { font: 800 2.6rem/1 var(--display); }
.nextcard .c { font: 400 1.25rem/1.25 var(--serif); }
.nextcard .s { color: var(--mist); }
.nextcard .row-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

/* ---------- day grid (desktop) ---------- */
.grid-wrap { overflow-x: auto; border: 1px solid var(--rule-2); background: var(--night); }
.dgrid { display: grid; position: relative; width: 100%; }
.dgrid .hcol { position: sticky; left: 0; z-index: 3; background: var(--night); border-right: 1px solid var(--rule); }
.dgrid .hcell { height: var(--slot); font-size: .75rem; color: var(--mist); padding: 2px 8px 0 4px; border-top: 1px solid var(--rule); text-align: right; }
.dgrid .hcell.half { color: transparent; border-top-style: dashed; }
.dgrid .head { position: sticky; top: 0; z-index: 4; height: 58px; display: flex; align-items: center; gap: 8px; padding: 0 8px; min-width: 0; overflow: hidden; background: var(--navy-2); border-bottom: 1px solid var(--rule-2); border-right: 1px solid var(--rule); font-weight: 700; }
.dgrid .head .hcorner { width: 0; }
.av { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; background: var(--navy-3); display: grid; place-items: center; font: 800 1rem var(--display); flex: none; }
.av img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; }
.head small { display: block; font-weight: 500; color: var(--mist); font-size: .75rem; }
.bcol { position: relative; min-width: 0; border-right: 1px solid var(--rule); background:
  repeating-linear-gradient(180deg, var(--rule) 0 1px, transparent 1px var(--slot)); }
.bcol .free { position: absolute; left: 4px; right: 4px; height: calc(var(--slot) - 4px); border: 1px dashed transparent; background: none; cursor: pointer; color: transparent; font-size: .75rem; font-weight: 700; }
.bcol .free:hover, .bcol .free:focus-visible { border-color: var(--rule-2); color: var(--mist); }
.ap { position: absolute; left: 4px; right: 4px; padding: 6px 10px 6px 10px; border: 1px solid var(--lav); border-left-width: 4px; background: rgba(138, 215, 176, .14); text-align: left; cursor: pointer; overflow: hidden; display: grid; align-content: start; gap: 0; }
.ap:hover { background: rgba(138, 215, 176, .24); }
.ap .tm { font-size: .6875rem; color: var(--mist); font-weight: 700; }
.ap .nm { font-weight: 700; font-size: .8125rem; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ap .sv { font-size: .75rem; color: var(--mist); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ap .tag { position: absolute; top: 6px; right: 8px; font: 700 .625rem/1 var(--ui); letter-spacing: .06em; text-transform: uppercase; }
.ap.st-chegou { border-color: var(--silver); background: rgba(210, 210, 210, .14); }
.ap.st-atendido { border-color: var(--ok); background: rgba(143, 211, 168, .1); }
.ap.st-atendido .nm::before { content: "✓ "; color: var(--ok); }
.ap.st-faltou { border-color: var(--warn); background: rgba(242, 184, 160, .08); }
.ap.st-faltou .nm { text-decoration: line-through; color: var(--mist); }
.ap.from-app .tag { color: var(--lav-2); }
.blk { position: absolute; left: 4px; right: 4px; display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--mist);
  background: repeating-linear-gradient(135deg, rgba(210, 210, 210, .08) 0 6px, transparent 6px 12px); border: 1px solid var(--rule); cursor: pointer; }
.nowline { position: absolute; left: 0; right: 0; height: 2px; background: var(--warn); z-index: 2; pointer-events: none; }
.nowline::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .75rem; color: var(--mist); margin-top: 10px; }
.legend i { display: inline-block; width: 12px; height: 12px; border: 1px solid; border-left-width: 4px; margin-right: 6px; vertical-align: -2px; }

/* ---------- day list (phone / barber) ---------- */
.dlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.li { width: 100%; display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--rule-2); border-left: 4px solid var(--lav); background: var(--navy); text-align: left; cursor: pointer; }
.li .tm { font: 800 1.35rem/1 var(--display); }
.li .tm small { display: block; font: 600 .6875rem/1.3 var(--ui); color: var(--mist); }
.li .nm { font-weight: 700; }
.li .sv { color: var(--mist); font-size: .8125rem; }
.li .who { display: flex; align-items: center; gap: 6px; font-size: .75rem; color: var(--mist); }
.li .who .av { width: 26px; height: 26px; font-size: .8rem; }
.li.st-atendido { border-left-color: var(--ok); } .li.st-atendido .nm::before { content: "✓ "; color: var(--ok); }
.li.st-faltou { border-left-color: var(--warn); } .li.st-faltou .nm { text-decoration: line-through; color: var(--mist); }
.li.st-chegou { border-left-color: var(--silver); }
.li.blk-li { border-left-color: var(--rule-2); background: repeating-linear-gradient(135deg, rgba(210, 210, 210, .05) 0 6px, transparent 6px 12px); }
.li.free-li { border-style: dashed; border-left: 1px dashed var(--rule-2); background: none; color: var(--mist); }
.li.free-li .tm { color: var(--mist); }
.only-desk { display: none; }
.only-phone { display: block; }
@media (min-width: 960px) { .only-desk { display: block; } .only-phone { display: none; } }

/* ---------- agenda toolbar + week ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar select { min-height: 44px; background: var(--night); color: var(--paper); border: 1px solid var(--rule-2); padding: 0 12px; font: 600 .875rem var(--ui); }
.daystrip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.daystrip button { flex: none; min-width: 66px; min-height: 56px; display: grid; place-items: center; gap: 0; padding: 6px 8px; border: 1px solid var(--rule-2); background: none; cursor: pointer; font-weight: 700; }
.daystrip button small { font-weight: 500; color: var(--mist); font-size: .75rem; }
.daystrip button[aria-pressed="true"] { background: var(--lav); border-color: var(--lav); color: var(--night); }
.daystrip button[aria-pressed="true"] small { color: var(--navy); }
.daystrip button:disabled { opacity: .4; cursor: not-allowed; }
.week { width: 100%; border-collapse: collapse; min-width: 640px; }
.week th, .week td { border: 1px solid var(--rule); padding: 8px; text-align: left; font-size: .8125rem; }
.week thead th { background: var(--navy-2); font-weight: 700; }
.week tbody th { font-weight: 700; white-space: nowrap; }
.week td button { width: 100%; background: none; border: 0; cursor: pointer; text-align: left; padding: 6px 4px; display: grid; gap: 4px; }
.week .bar { height: 8px; background: rgba(210, 210, 210, .12); }
.week .bar i { display: block; height: 100%; background: var(--lav); }
.week .closed { color: var(--mist); }

/* ---------- dialogs ---------- */
dialog.dlg { width: min(520px, 100%); max-height: min(90svh, 760px); padding: 0; border: 1px solid var(--lav); background: var(--night); color: var(--paper); }
dialog.dlg::backdrop { background: rgba(4, 16, 10, .72); }
dialog.dlg[open] { animation: up .35s var(--ease) both; }
@keyframes up { from { opacity: 0; transform: translateY(18px); } }
@media (max-width: 640px) { dialog.dlg { width: 100%; max-width: 100%; inset: auto 0 0 0; margin: 0; border-width: 1px 0 0; } }
.dh { display: flex; align-items: center; gap: 10px; padding: 14px 14px 12px 18px; border-bottom: 1px solid var(--rule); }
.dh > div { flex: 1; min-width: 0; }
.dh h2 { margin: 2px 0 0; font: 800 1.6rem/1 var(--display); text-transform: uppercase; }
.x { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 1px solid var(--rule-2); cursor: pointer; flex: none; }
.x svg { width: 18px; height: 18px; }
.db { padding: 16px 18px 20px; display: grid; gap: 14px; overflow: auto; }
.info { margin: 0; display: grid; }
.info div { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--rule); }
.info dt { color: var(--mist); }
.info dd { margin: 0; font-weight: 700; text-align: right; }
.acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.acts .btn { min-height: 52px; }
.stbadge { display: inline-block; padding: 4px 8px; font: 700 .6875rem/1.3 var(--ui); letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--lav); color: var(--lav-2); }
.stbadge.atendido { border-color: var(--ok); color: var(--ok); } .stbadge.faltou { border-color: var(--warn); color: var(--warn); } .stbadge.chegou { border-color: var(--silver); color: var(--silver); }
.field { display: grid; gap: 6px; }
.field label, .field legend { font-weight: 700; font-size: .875rem; padding: 0; }
.field input, .field select { width: 100%; min-height: 48px; background: var(--navy); color: var(--paper); border: 1px solid var(--rule-2); padding: 0 12px; font: 500 1rem var(--ui); }
.field small { color: var(--mist); font-size: .8125rem; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.times { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; }
.times button { min-height: 44px; border: 1px solid var(--rule-2); background: none; cursor: pointer; font-weight: 700; }
.times button[aria-pressed="true"] { background: var(--lav); border-color: var(--lav); color: var(--night); }
.err { margin: 0; color: var(--warn); font-weight: 600; }
.err:empty { display: none; }
.note { font-size: .8125rem; color: var(--mist); margin: 0; }
.live { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 20px); z-index: 60; opacity: 0; padding: 12px 18px; background: var(--paper); color: var(--night);
  font-weight: 700; transition: opacity .25s, transform .35s var(--ease); max-width: calc(100% - 32px); pointer-events: none; }
.live.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 959px) { .live { bottom: calc(84px + env(safe-area-inset-bottom)); } }
.screen[hidden] { display: none; }
</style>
</head>
<body>
<a class="skip" href="#conteudo">Pular para o conteúdo</a>
<div class="app">
  <nav class="side" aria-label="Gestão">
    <div class="brand"><img src="assets/marca/selo-branco.svg" alt="" width="38" height="38"><span>DB Barbearia<small>Gestão</small></span></div>
    <div id="side-nav"></div>
    <div class="foot">Protótipo · dados de exemplo<br><button type="button" id="reset">Restaurar dados de exemplo</button></div>
  </nav>

  <div class="main">
    <header class="top">
      <img class="mlogo" src="assets/marca/selo-branco.svg" alt="" width="32" height="32">
      <h1 id="title" tabindex="-1">Hoje</h1>
      <div class="view-as"><span id="va-l">Ver como</span>
        <div class="seg" role="group" aria-labelledby="va-l"><button type="button" data-as="dono" aria-pressed="true">Dono</button><button type="button" data-as="bruno" aria-pressed="false">Barbeiro (Bruno)</button></div>
      </div>
    </header>

    <main class="content" id="conteudo">
      <!-- HOJE -->
      <section class="screen" id="s-hoje" aria-labelledby="title">
        <p class="closed-note" id="closed-note" hidden></p>
        <div class="kpis" id="kpis"></div>
        <div class="split">
          <section class="panel" aria-labelledby="t-day">
            <div class="ph-row"><h2 class="ph" id="t-day">Agenda do dia</h2><button class="btn solid" type="button" data-new>+ Encaixe</button></div>
            <div class="only-desk" id="day-grid"></div>
            <ol class="dlist only-phone" id="day-list"></ol>
            <div class="legend only-desk" aria-hidden="true"><span><i style="border-color:var(--lav);background:rgba(138,215,176,.14)"></i>Agendado</span><span><i style="border-color:var(--silver)"></i>Chegou</span><span><i style="border-color:var(--ok)"></i>Atendido</span><span><i style="border-color:var(--warn)"></i>Faltou</span><span><i style="border-color:var(--rule-2);background:repeating-linear-gradient(135deg,rgba(210,210,210,.15) 0 3px,transparent 3px 6px)"></i>Bloqueado</span></div>
          </section>
          <aside class="col-side" style="display:grid;gap:18px">
            <section class="panel" aria-labelledby="t-next" id="next-wrap"><h2 id="t-next">Próximo cliente</h2><div class="nextcard" id="next"></div></section>
            <section class="panel" aria-labelledby="t-pend" id="pend-wrap"><h2 id="t-pend">Pendências</h2><ul class="pend" id="pend"></ul></section>
          </aside>
        </div>
      </section>

      <!-- AGENDA -->
      <section class="screen" id="s-agenda" aria-labelledby="title" hidden>
        <div class="toolbar">
          <div class="seg" role="group" aria-label="Visão"><button type="button" data-mode="dia" aria-pressed="true">Dia</button><button type="button" data-mode="semana" aria-pressed="false">Semana</button></div>
          <label class="sr-only" for="f-bar">Barbeiro</label>
          <select id="f-bar"></select>
          <span style="flex:1"></span>
          <button class="btn" type="button" data-block>Bloquear horário</button>
          <button class="btn solid" type="button" data-new>+ Encaixe</button>
        </div>
        <div class="daystrip" id="daystrip" role="group" aria-label="Dia"></div>
        <div id="ag-day">
          <div class="only-desk" id="ag-grid"></div>
          <ol class="dlist only-phone" id="ag-list"></ol>
        </div>
        <div id="ag-week" hidden><div class="grid-wrap"><table class="week" id="week"></table></div><p class="note" style="margin-top:8px">Toque num dia para abrir a agenda dele.</p></div>
      </section>
    </main>
  </div>
</div>

<nav class="tabbar" aria-label="Gestão" id="tabbar"></nav>

<!-- appointment details -->
<dialog class="dlg" id="d-ap" aria-labelledby="d-ap-t">
  <div class="dh"><div><p class="eyebrow" id="d-ap-e"></p><h2 id="d-ap-t" tabindex="-1"></h2></div><button class="x" type="button" data-close aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>
  <div class="db" id="d-ap-b"></div>
</dialog>
<!-- new booking / move / block -->
<dialog class="dlg" id="d-form" aria-labelledby="d-form-t">
  <div class="dh"><div><p class="eyebrow" id="d-form-e"></p><h2 id="d-form-t" tabindex="-1"></h2></div><button class="x" type="button" data-close aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>
  <form class="db" id="d-form-b" novalidate></form>
</dialog>
<div class="live" id="live" role="status" aria-live="polite"></div>

<script>
(() => {
  const D = window.DBB, { EQUIPE, SERVICOS, HORAS, DIAS, brl, hhmm } = D;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const live = $("live"); let lt;
  const say = t => { live.textContent = t; live.classList.add("show"); clearTimeout(lt); lt = setTimeout(() => live.classList.remove("show"), 3200); };
  const LS = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (_) { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} } };
  const KEY = "dbb.admin.v1", APPKEY = "dbb.app.agendamentos";
  const DAYS = D.days(14);
  const NOW = D.now();
  const dayLabel = (d, long) => d.i === 0 ? "Hoje" : d.i === 1 ? "Amanhã" : long ? DIAS[d.wd][0].toUpperCase() + DIAS[d.wd].slice(1) : DIAS[d.wd].slice(0, 3).replace(/^./, c => c.toUpperCase());
  const dateTxt = d => `${String(d.d).padStart(2, "0")}/${String(d.mo).padStart(2, "0")}`;
  const barber = id => EQUIPE.find(b => b.id === id) || { id, nome: "?" };
  const avatar = b => `<span class="av" aria-hidden="true">${b.foto ? `<img src="${esc(b.foto)}" alt="" loading="lazy">` : esc(b.nome[0])}</span>`;

  // ---------- demo data (deterministic) ----------
  const H = s => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return (h >>> 0) / 4294967295; };
  const NOMES = ["João Pedro S.", "Lucas M.", "Rafael C.", "Gabriel A.", "Matheus R.", "Felipe B.", "Lucas T.", "Gustavo L.", "Thiago P.", "Diego F.", "Eduardo N.", "Leonardo V.",
    "Vinícius G.", "André K.", "Caio D.", "Renan O.", "Marcelo H.", "Henrique J.", "Otávio Q.", "Samuel E.", "Daniel X.", "Igor Z.", "Murilo W.", "Paulo Y."];
  const MIX = [[0, .3], [8, .25], [4, .14], [1, .1], [10, .07], [2, .06], [9, .05], [14, .03]]; // [service index, weight]
  const pickSvc = r => { let a = 0; for (const [i, w] of MIX) { a += w; if (r < a) return i; } return 0; };
  function generate() {
    const appts = [], blocks = [];
    DAYS.forEach(day => {
      const h = HORAS[day.wd]; if (!h) return;
      EQUIPE.forEach((b, bi) => {
        // lunch break for everyone on weekdays, staggered
        if (day.wd !== 6) blocks.push({ id: `b-${day.i}-${b.id}`, day: day.i, bar: b.id, min: 720 + (bi % 3) * 30, dur: 60, why: "Almoço" });
        let m = h[0];
        while (m + 30 <= h[1]) {
          const lunch = blocks.find(x => x.day === day.i && x.bar === b.id && m >= x.min && m < x.min + x.dur);
          if (lunch) { m = lunch.min + lunch.dur; continue; }
          const r = H(`${day.i}-${b.id}-${m}`);
          if (r < (day.i === 0 ? .62 : .58 - day.i * .03)) {
            const svc = pickSvc(H(`s-${day.i}-${b.id}-${m}`)), dur = Math.max(30, Math.ceil(SERVICOS[svc].m / 30) * 30);
            if (m + dur > h[1]) break;
            const nm = NOMES[Math.floor(H(`n-${day.i}-${b.id}-${m}`) * NOMES.length)];
            appts.push({ id: `a-${day.i}-${b.id}-${m}`, day: day.i, bar: b.id, min: m, dur, svc, cli: nm, tel: "(48) 9 9" + String(Math.floor(H(`t${m}${b.id}`) * 1e7)).padStart(7, "0").replace(/(\d{3})(\d{4})/, "$1-$2"), st: "agendado", src: H(`o${m}${day.i}${b.id}`) < .35 ? "app" : "balcão" });
            m += dur;
          } else m += 30;
        }
      });
    });
    return { appts, blocks, v: 1 };
  }
  let db = LS.get(KEY, null);
  if (!db || !db.appts) { db = generate(); LS.set(KEY, db); }
  const save = () => LS.set(KEY, db);
  // statuses for what already happened today
  if (DAYS[0].open) db.appts.filter(a => a.day === 0 && a.st === "agendado" && a.min + a.dur <= NOW.min).forEach(a => { a.st = H(a.id) < .1 ? "faltou" : "atendido"; });

  // bookings made in the client app / site (same browser) show up here
  function importApp() {
    const list = LS.get(APPKEY, []), known = new Set(db.appts.map(a => a.id));
    let n = 0;
    list.forEach(x => {
      const id = "app-" + x.id; if (known.has(id)) return;
      const day = DAYS.find(d => d.y === x.y && d.mo === x.mo && d.d === x.d); if (!day) return;
      const bar = x.bar && x.bar !== "any" ? x.bar : (EQUIPE.find(b => !busy(day.i, b.id, x.min, x.dur)) || EQUIPE[0]).id;
      const dur = Math.max(30, Math.ceil((x.dur || 30) / 30) * 30);
      // a real booking wins over example data in the same slot
      db.appts = db.appts.filter(a => !(a.id.startsWith("a-") && a.day === day.i && a.bar === bar && x.min < a.min + a.dur && a.min < x.min + dur));
      db.appts.push({ id, day: day.i, bar, min: x.min, dur: Math.max(30, Math.ceil((x.dur || 30) / 30) * 30), svc: x.svc >= 0 ? x.svc : 0, svcName: x.svcName, cli: x.nome || "Cliente do app", tel: x.tel || "", st: "agendado", src: "app", isNew: 1 });
      n++;
    });
    if (n) { save(); say(`${n} ${n === 1 ? "novo agendamento chegou" : "novos agendamentos chegaram"} pelo app.`); }
    return n;
  }
  const busy = (day, bar, min, dur, except) =>
    db.appts.some(a => a.id !== except && a.day === day && a.bar === bar && a.st !== "faltou" && min < a.min + a.dur && a.min < min + dur) ||
    db.blocks.some(b => b.day === day && b.bar === bar && min < b.min + b.dur && b.min < min + dur);
  importApp();

  // ---------- state ----------
  let as = "dono", screen = "hoje", agDay = null, agBar = "todos", agMode = "dia";
  const firstOpen = DAYS.find(d => d.open && (d.i > 0 || HORAS[d.wd][1] > NOW.min)) || DAYS[0];
  const todayDay = DAYS[0].open ? DAYS[0] : firstOpen;
  agDay = todayDay.i;
  const visibleBarbers = () => as === "dono" ? EQUIPE : EQUIPE.filter(b => b.id === as);
  const svcName = a => a.svcName || SERVICOS[a.svc].n;
  const price = a => SERVICOS[a.svc] ? SERVICOS[a.svc].p || 0 : 0;

  // ---------- navigation ----------
  const I = {
    hoje: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    agenda: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2"/></svg>',
    clientes: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.7 2.5 3 5.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
    beneficios: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="9" width="17" height="11.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2.5 9h19M12 9v11.5" stroke="currentColor" stroke-width="2"/></svg>',
    catalogo: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    equipe: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21c1-4.5 4.2-6.5 8-6.5s7 2 8 6.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
    numeros: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    site: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
    mais: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>',
    chev: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };
  const SCREENS = [["hoje", "Hoje", 1], ["agenda", "Agenda", 1], ["clientes", "Clientes", 0], ["beneficios", "Benefícios", 0], ["catalogo", "Catálogo", 0], ["equipe", "Equipe", 0], ["numeros", "Números", 0], ["site", "Site e Instagram", 0]];
  function renderNav() {
    const owner = as === "dono";
    $("side-nav").innerHTML = SCREENS.filter(([k]) => owner || k === "hoje" || k === "agenda").map(([k, n, ready]) =>
      `<a class="nav-a" href="#${k}"${k === screen ? ' aria-current="page"' : ""}>${I[k]}<span>${n}</span>${ready ? "" : '<span class="soon">em breve</span>'}</a>`).join("");
    const tabs = owner ? [["hoje", "Hoje"], ["agenda", "Agenda"], ["clientes", "Clientes"], ["mais", "Mais"]] : [["hoje", "Hoje"], ["agenda", "Agenda"]];
    $("tabbar").style.gridTemplateColumns = `repeat(${tabs.length}, 1fr)`;
    $("tabbar").innerHTML = tabs.map(([k, n]) => `<a href="#${k}"${k === screen ? ' aria-current="page"' : ""}>${I[k]}<span>${n}</span></a>`).join("");
  }
  function route(focus) {
    let k = (location.hash || "#hoje").slice(1);
    const sc = SCREENS.find(s => s[0] === k);
    if (k === "mais" || (sc && !sc[2])) { say(k === "mais" ? "Catálogo, equipe, números e site entram nas próximas etapas." : `${sc[1]}: entra na próxima etapa do protótipo.`); history.replaceState(null, "", "#" + screen); renderNav(); return; }
    if (!sc) k = "hoje";
    screen = k;
    document.querySelectorAll(".screen").forEach(s => { s.hidden = s.id !== "s-" + k; });
    $("title").textContent = sc ? sc[1] : "Hoje";
    document.title = `${$("title").textContent} · Gestão · DB Barbearia`;
    renderNav(); render();
    if (focus) $("title").focus();
  }
  addEventListener("hashchange", () => route(true));

  // view as (owner / barber)
  document.querySelectorAll("[data-as]").forEach(b => b.addEventListener("click", () => {
    as = b.dataset.as;
    document.querySelectorAll("[data-as]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    agBar = as === "dono" ? "todos" : as;
    render(); renderNav();
    say(as === "dono" ? "Vendo como dono: agenda de toda a equipe." : "Vendo como Bruno: só a agenda dele, no celular.");
  }));

  // ---------- render ----------
  const dayAppts = (day, bars) => db.appts.filter(a => a.day === day && bars.some(b => b.id === a.bar)).sort((a, b) => a.min - b.min || a.bar.localeCompare(b.bar));
  function render() { if (screen === "hoje") renderHoje(); if (screen === "agenda") renderAgenda(); }

  function renderHoje() {
    const bars = visibleBarbers(), d = todayDay, list = dayAppts(d.i, bars);
    const note = $("closed-note");
    note.hidden = d.i === 0;
    note.textContent = d.i === 0 ? "" : `Hoje a barbearia está fechada. Mostrando o próximo dia aberto: ${dayLabel(d, true).toLowerCase()}, ${dateTxt(d)}.`;
    const valid = list.filter(a => a.st !== "faltou"), h = HORAS[d.wd];
    let free = 0; bars.forEach(b => { for (let m = h[0]; m + 30 <= h[1]; m += 30) if ((d.i > 0 || m > NOW.min) && !busy(d.i, b.id, m, 30)) free++; });
    const done = list.filter(a => a.st === "atendido").length, miss = list.filter(a => a.st === "faltou").length;
    $("kpis").innerHTML = [
      [valid.length, `atendimentos ${as === "dono" ? "no dia" : "seus no dia"}`],
      as === "dono" ? [brl(valid.reduce((s, a) => s + price(a), 0)), "faturamento previsto"] : [done, "já atendidos"],
      [free, "horários livres"],
      [miss, "faltas", miss ? "alert" : ""]
    ].map(([v, l, c]) => `<div class="kpi ${c || ""}"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("");
    $("day-grid").innerHTML = gridHTML(d, bars);
    $("day-list").innerHTML = listHTML(d, bars, false);
    // next client
    const nx = list.find(a => a.st === "agendado" || a.st === "chegou") ;
    $("next").innerHTML = nx ? `<span class="t">${hhmm(nx.min)}</span><span class="c">${esc(nx.cli)}</span><span class="s">${esc(svcName(nx))} · com ${esc(barber(nx.bar).nome)}${nx.src === "app" ? " · agendou pelo app" : ""}</span>
      <div class="row-btns">${nx.st === "agendado" ? `<button class="btn solid" type="button" data-st="chegou" data-id="${nx.id}">Chegou</button>` : `<button class="btn ok" type="button" data-st="atendido" data-id="${nx.id}">Atendido</button>`}<button class="btn" type="button" data-open="${nx.id}">Detalhes</button></div>`
      : `<span class="s">Sem mais clientes neste dia.</span>`;
    // pending (owner)
    $("pend-wrap").hidden = as !== "dono";
    const appNew = db.appts.filter(a => a.isNew).length;
    $("pend").innerHTML = [[3, "pontos para validar", "Instagram e stories"], [1, "prêmio para entregar", "Pomada da casa"], [appNew, `agendamento${appNew === 1 ? "" : "s"} novo${appNew === 1 ? "" : "s"} pelo app`, "desde a última visita"], [2, "avaliações novas no Google", "nota segue 5,0"]]
      .map(([n, t, s]) => `<li><button type="button" data-pend><b>${n}</b><span>${esc(t)}<br><small>${esc(s)}</small></span><span class="chev">${I.chev}</span></button></li>`).join("");
  }

  function gridHTML(d, bars) {
    const h = HORAS[d.wd]; if (!h) return `<p class="note">Fechado neste dia.</p>`;
    const start = 510, end = 1200, rows = (end - start) / 30, top = m => (m - start) / 30;
    let hcol = `<div class="hcol"><div class="head"><span class="hcorner"></span></div>`;
    for (let r = 0; r < rows; r++) { const m = start + r * 30; hcol += `<div class="hcell${m % 60 ? " half" : ""}">${hhmm(m)}</div>`; }
    hcol += "</div>";
    const cols = bars.map(b => {
      const aps = db.appts.filter(a => a.day === d.i && a.bar === b.id), bls = db.blocks.filter(x => x.day === d.i && x.bar === b.id);
      let inner = "";
      for (let m = h[0]; m + 30 <= h[1]; m += 30) if (!busy(d.i, b.id, m, 30) && (d.i > 0 || m > NOW.min))
        inner += `<button class="free" type="button" style="top:calc(${top(m)} * var(--slot) + 2px)" data-free="${d.i}|${b.id}|${m}" aria-label="Encaixar com ${esc(b.nome)} às ${hhmm(m)}">+ ${hhmm(m)}</button>`;
      inner += bls.map(x => `<button class="blk" type="button" style="top:calc(${top(x.min)} * var(--slot) + 2px);height:calc(${x.dur / 30} * var(--slot) - 4px)" data-blk="${x.id}" aria-label="${esc(x.why)} de ${esc(b.nome)}, ${hhmm(x.min)} às ${hhmm(x.min + x.dur)}. Abrir">${esc(x.why)}</button>`).join("");
      inner += aps.map(a => `<button class="ap st-${a.st}${a.src === "app" ? " from-app" : ""}" type="button" style="top:calc(${top(a.min)} * var(--slot) + 2px);height:calc(${a.dur / 30} * var(--slot) - 4px)" data-open="${a.id}"
        aria-label="${hhmm(a.min)}, ${esc(a.cli)}, ${esc(svcName(a))}, ${a.st}${a.src === "app" ? ", agendou pelo app" : ""}"><span class="tm">${hhmm(a.min)}–${hhmm(a.min + a.dur)}</span><span class="nm">${esc(a.cli)}</span>${a.dur > 30 ? `<span class="sv">${esc(svcName(a))}</span>` : ""}${a.src === "app" ? '<span class="tag">app</span>' : ""}</button>`).join("");
      if (d.i === 0 && NOW.min >= start && NOW.min <= end) inner += `<span class="nowline" style="top:calc(${(NOW.min - start) / 30} * var(--slot))" aria-hidden="true"></span>`;
      return `<div><div class="head">${avatar(b)}<span>${esc(b.nome)}<small>${aps.filter(a => a.st !== "faltou").length} clientes</small></span></div><div class="bcol" style="height:calc(${rows} * var(--slot))">${inner}</div></div>`;
    }).join("");
    return `<div class="grid-wrap"><div class="dgrid" style="grid-template-columns:64px repeat(${bars.length}, minmax(${bars.length > 1 ? 128 : 220}px, 1fr))">${hcol}${cols}</div></div>`;
  }

  function listHTML(d, bars, withFree) {
    const h = HORAS[d.wd]; if (!h) return `<li class="note">Fechado neste dia.</li>`;
    const items = [];
    dayAppts(d.i, bars).forEach(a => items.push([a.min, `<li><button class="li st-${a.st}" type="button" data-open="${a.id}"><span class="tm">${hhmm(a.min)}<small>${a.dur} min</small></span>
      <span><span class="nm">${esc(a.cli)}</span><br><span class="sv">${esc(svcName(a))}${a.src === "app" ? " · app" : ""}</span></span>
      ${bars.length > 1 ? `<span class="who">${avatar(barber(a.bar))}${esc(barber(a.bar).nome)}</span>` : `<span class="stbadge ${a.st}">${a.st}</span>`}</button></li>`]));
    db.blocks.filter(x => x.day === d.i && bars.some(b => b.id === x.bar)).forEach(x => items.push([x.min, `<li><button class="li blk-li" type="button" data-blk="${x.id}"><span class="tm">${hhmm(x.min)}<small>${x.dur} min</small></span><span><span class="nm">${esc(x.why)}</span><br><span class="sv">${esc(barber(x.bar).nome)}</span></span><span></span></button></li>`]));
    if (withFree && bars.length === 1) for (let m = h[0]; m + 30 <= h[1]; m += 30) if (!busy(d.i, bars[0].id, m, 30) && (d.i > 0 || m > NOW.min))
      items.push([m + .1, `<li><button class="li free-li" type="button" data-free="${d.i}|${bars[0].id}|${m}"><span class="tm">${hhmm(m)}</span><span>Livre · toque para encaixar</span><span></span></button></li>`]);
    return items.sort((a, b) => a[0] - b[0]).map(x => x[1]).join("") || `<li class="note">Nenhum horário neste dia.</li>`;
  }

  function renderAgenda() {
    const sel = $("f-bar");
    sel.innerHTML = (as === "dono" ? `<option value="todos">Toda a equipe</option>` : "") + visibleBarbers().map(b => `<option value="${b.id}">${esc(b.nome)}</option>`).join("");
    if (as !== "dono") agBar = as;
    sel.value = agBar;
    $("daystrip").innerHTML = DAYS.slice(0, 12).map(d => `<button type="button" data-day="${d.i}" aria-pressed="${d.i === agDay}"${d.open ? "" : " disabled"}>${dayLabel(d)}<small>${dateTxt(d)}${d.open ? "" : " · fechado"}</small></button>`).join("");
    const bars = agBar === "todos" ? visibleBarbers() : visibleBarbers().filter(b => b.id === agBar);
    $("ag-day").hidden = agMode !== "dia"; $("ag-week").hidden = agMode !== "semana"; $("daystrip").hidden = agMode !== "dia";
    if (agMode === "dia") {
      const d = DAYS[agDay];
      $("ag-grid").innerHTML = gridHTML(d, bars);
      $("ag-list").innerHTML = listHTML(d, bars, true);
    } else {
      const wk = DAYS.slice(0, 7);
      $("week").innerHTML = `<thead><tr><th scope="col">Barbeiro</th>${wk.map(d => `<th scope="col">${dayLabel(d)} ${dateTxt(d)}</th>`).join("")}</tr></thead><tbody>${bars.map(b => `<tr><th scope="row">${esc(b.nome)}</th>${wk.map(d => {
        const h = HORAS[d.wd]; if (!h) return `<td class="closed">Fechado</td>`;
        const tot = (h[1] - h[0]) / 30, used = db.appts.filter(a => a.day === d.i && a.bar === b.id && a.st !== "faltou").reduce((s, a) => s + a.dur / 30, 0), pct = Math.round(used / tot * 100);
        return `<td><button type="button" data-goday="${d.i}" aria-label="${esc(b.nome)}, ${dayLabel(d, true)} ${dateTxt(d)}: ${pct}% ocupado. Abrir o dia"><span>${pct}% ocupado</span><span class="bar"><i style="width:${pct}%"></i></span></button></td>`;
      }).join("")}</tr>`).join("")}</tbody>`;
    }
    document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.mode === agMode)));
  }
  $("f-bar").addEventListener("change", e => { agBar = e.target.value; renderAgenda(); });
  document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => { agMode = b.dataset.mode; renderAgenda(); }));
  $("daystrip").addEventListener("click", e => { const b = e.target.closest("[data-day]"); if (b) { agDay = +b.dataset.day; renderAgenda(); } });
  $("week").addEventListener("click", e => { const b = e.target.closest("[data-goday]"); if (b) { agDay = +b.dataset.goday; agMode = "dia"; renderAgenda(); $("title").focus(); } });

  // ---------- dialogs ----------
  let opener = null;
  const openD = (id, trigger) => { opener = trigger || document.activeElement; $(id).showModal(); $(id).querySelector("h2").focus(); };
  document.querySelectorAll("dialog.dlg").forEach(d => {
    d.addEventListener("click", e => { if (e.target === d || e.target.closest("[data-close]")) d.close(); });
    d.addEventListener("close", () => { if (opener && document.contains(opener)) opener.focus(); });
  });

  const ST = { agendado: "Agendado", chegou: "Chegou", atendido: "Atendido", faltou: "Faltou" };
  function openAppt(id, trigger) {
    const a = db.appts.find(x => x.id === id); if (!a) return;
    a.isNew = 0; save();
    const d = DAYS[a.day], b = barber(a.bar), p = price(a);
    $("d-ap-e").innerHTML = `<span class="stbadge ${a.st}">${ST[a.st]}</span>${a.src === "app" ? ' <span class="stbadge">agendou pelo app</span>' : ""}`;
    $("d-ap-t").textContent = a.cli;
    const acts = a.st === "agendado" ? `<button class="btn solid" type="button" data-st="chegou" data-id="${a.id}">Chegou</button><button class="btn warn" type="button" data-st="faltou" data-id="${a.id}">Faltou</button>`
      : a.st === "chegou" ? `<button class="btn ok" type="button" data-st="atendido" data-id="${a.id}">Atendido</button><button class="btn" type="button" data-st="agendado" data-id="${a.id}">Desfazer chegada</button>`
      : `<button class="btn" type="button" data-st="agendado" data-id="${a.id}">Voltar para agendado</button><span></span>`;
    $("d-ap-b").innerHTML = `<dl class="info">
        <div><dt>Quando</dt><dd>${dayLabel(d, true)}, ${dateTxt(d)} · ${hhmm(a.min)} às ${hhmm(a.min + a.dur)}</dd></div>
        <div><dt>Serviço</dt><dd>${esc(svcName(a))}</dd></div>
        <div><dt>Barbeiro</dt><dd>${esc(b.nome)}</dd></div>
        <div><dt>Valor</dt><dd>${brl(p)}</dd></div>
        <div><dt>WhatsApp</dt><dd>${esc(a.tel || "não informado")}</dd></div>
        ${a.src === "app" ? `<div><dt>Pontos ao atender</dt><dd>+${Math.round(p)}</dd></div>` : ""}
      </dl>
      <div class="acts">${acts}</div>
      <div class="acts"><button class="btn" type="button" data-move="${a.id}">Remarcar</button><button class="btn" type="button" data-wa="${a.id}">WhatsApp do cliente</button></div>
      ${a.st === "agendado" ? `<button class="btn warn" type="button" data-cancel="${a.id}" style="justify-self:start">Cancelar horário</button>` : ""}
      <p class="note">“Atendido” fecha o atendimento: no sistema, credita os pontos do cliente e conta no faturamento.</p>`;
    if (!$("d-ap").open) openD("d-ap", trigger);
  }

  function setStatus(id, st) {
    const a = db.appts.find(x => x.id === id); if (!a) return;
    a.st = st; save(); render();
    const msg = { chegou: `${a.cli} chegou.`, atendido: `Atendimento de ${a.cli} concluído.${a.src === "app" ? ` +${Math.round(price(a))} pontos para ele.` : ""}`, faltou: `Falta registrada para ${a.cli}. O horário ficou livre.`, agendado: `${a.cli} voltou para agendado.` }[st];
    say(msg);
    if ($("d-ap").open) openAppt(id);
  }

  // ---------- forms: new booking (encaixe), move, block ----------
  let fs = {};
  function freeTimes(day, bar, dur, except) {
    const d = DAYS[day], h = HORAS[d.wd]; if (!h) return [];
    const out = []; for (let m = h[0]; m + dur <= h[1]; m += 30) if ((day > 0 || m > NOW.min) && !busy(day, bar, m, dur, except)) out.push(m);
    return out;
  }
  function formHTML() {
    const bars = visibleBarbers();
    const svcOpts = SERVICOS.map((s, i) => `<option value="${i}"${+fs.svc === i ? " selected" : ""}>${esc(s.n)} · ${brl(s.p)} · ${s.m} min</option>`).join("");
    const dayOpts = DAYS.slice(0, 12).filter(d => d.open).map(d => `<option value="${d.i}"${+fs.day === d.i ? " selected" : ""}>${dayLabel(d, true)}, ${dateTxt(d)}</option>`).join("");
    const barOpts = bars.map(b => `<option value="${b.id}"${fs.bar === b.id ? " selected" : ""}>${esc(b.nome)}</option>`).join("");
    const dur = fs.kind === "block" ? +fs.dur : Math.max(30, Math.ceil(SERVICOS[+fs.svc].m / 30) * 30);
    const times = freeTimes(+fs.day, fs.bar, dur, fs.except);
    if (!times.includes(fs.time)) fs.time = null;
    const tHTML = times.length ? `<div class="times" role="group" aria-label="Horários livres">${times.map(m => `<button type="button" data-time="${m}" aria-pressed="${fs.time === m}">${hhmm(m)}</button>`).join("")}</div>` : `<p class="note">Sem horário livre para essa duração neste dia.</p>`;
    if (fs.kind === "block") return `
      <div class="row2"><div class="field"><label for="ff-bar">Barbeiro</label><select id="ff-bar" name="bar">${barOpts}</select></div>
      <div class="field"><label for="ff-day">Dia</label><select id="ff-day" name="day">${dayOpts}</select></div></div>
      <div class="row2"><div class="field"><label for="ff-why">Motivo</label><select id="ff-why" name="why">${["Almoço", "Folga", "Compromisso", "Curso"].map(w => `<option${fs.why === w ? " selected" : ""}>${w}</option>`).join("")}</select></div>
      <div class="field"><label for="ff-dur">Duração</label><select id="ff-dur" name="dur">${[30, 60, 90, 120, 240].map(m => `<option value="${m}"${+fs.dur === m ? " selected" : ""}>${m < 60 ? m + " min" : m / 60 + " h"}</option>`).join("")}</select></div></div>
      <fieldset class="field" style="border:0;margin:0;padding:0"><legend>A partir de</legend>${tHTML}</fieldset>
      <p class="err" id="ff-err" role="alert"></p>
      <button class="btn solid" type="submit">Bloquear horário</button>
      <p class="note">O horário some do site e do app na hora.</p>`;
    return `
      ${fs.kind === "move" ? `<p class="note">Remarcando <b>${esc(fs.cli)}</b>. O cliente é avisado no WhatsApp.</p>` : `
      <div class="row2"><div class="field"><label for="ff-cli">Cliente</label><input id="ff-cli" name="cli" autocomplete="off" value="${esc(fs.cli || "")}" placeholder="Nome"></div>
      <div class="field"><label for="ff-tel">WhatsApp <small>opcional</small></label><input id="ff-tel" name="tel" type="tel" inputmode="tel" autocomplete="off" value="${esc(fs.tel || "")}" placeholder="(48) 9 0000-0000"></div></div>`}
      <div class="field"><label for="ff-svc">Serviço</label><select id="ff-svc" name="svc"${fs.kind === "move" ? " disabled" : ""}>${svcOpts}</select></div>
      <div class="row2"><div class="field"><label for="ff-bar">Barbeiro</label><select id="ff-bar" name="bar">${barOpts}</select></div>
      <div class="field"><label for="ff-day">Dia</label><select id="ff-day" name="day">${dayOpts}</select></div></div>
      <fieldset class="field" style="border:0;margin:0;padding:0"><legend>Horário</legend>${tHTML}</fieldset>
      <p class="err" id="ff-err" role="alert"></p>
      <button class="btn solid" type="submit">${fs.kind === "move" ? "Confirmar novo horário" : "Encaixar cliente"}</button>`;
  }
  function openForm(kind, preset, trigger) {
    const firstBar = visibleBarbers()[0].id;
    fs = { kind, svc: 0, bar: as === "dono" ? firstBar : as, day: (screen === "agenda" ? agDay : todayDay.i), time: null, why: "Almoço", dur: 60, ...preset };
    if (!DAYS[fs.day].open) fs.day = todayDay.i;
    $("d-form-e").textContent = kind === "block" ? "Agenda" : kind === "move" ? "Remarcar" : "Cliente de balcão ou telefone";
    $("d-form-t").textContent = kind === "block" ? "Bloquear horário" : kind === "move" ? "Novo horário" : "Encaixe";
    $("d-form-b").innerHTML = formHTML();
    if (!$("d-form").open) openD("d-form", trigger);
  }
  const form = $("d-form-b");
  form.addEventListener("change", e => {
    const t = e.target; if (!t.name) return;
    fs[t.name] = t.name === "day" || t.name === "svc" || t.name === "dur" ? +t.value : t.value;
    const keep = document.activeElement && document.activeElement.id;
    form.innerHTML = formHTML(); if (keep && $(keep)) $(keep).focus();
  });
  form.addEventListener("input", e => { if (e.target.name === "cli" || e.target.name === "tel") fs[e.target.name] = e.target.value; });
  form.addEventListener("click", e => {
    const b = e.target.closest("[data-time]"); if (!b) return;
    fs.time = +b.dataset.time; form.querySelectorAll("[data-time]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  });
  form.addEventListener("submit", e => {
    e.preventDefault();
    const err = msg => { $("ff-err").textContent = msg; };
    if (fs.kind === "new" && !(fs.cli || "").trim()) { err("Escreva o nome do cliente."); $("ff-cli").focus(); return; }
    if (fs.time == null) { err("Escolha o horário."); form.querySelector("[data-time]")?.focus(); return; }
    const d = DAYS[fs.day];
    if (fs.kind === "block") {
      db.blocks.push({ id: "b-" + Date.now(), day: fs.day, bar: fs.bar, min: fs.time, dur: +fs.dur, why: fs.why });
      say(`${fs.why} bloqueado para ${barber(fs.bar).nome}: ${dayLabel(d, true).toLowerCase()}, ${hhmm(fs.time)}.`);
    } else if (fs.kind === "move") {
      const a = db.appts.find(x => x.id === fs.except); Object.assign(a, { day: fs.day, bar: fs.bar, min: fs.time, st: "agendado" });
      say(`${a.cli} remarcado para ${dayLabel(d, true).toLowerCase()}, ${hhmm(fs.time)}, com ${barber(fs.bar).nome}.`);
    } else {
      const dur = Math.max(30, Math.ceil(SERVICOS[fs.svc].m / 30) * 30);
      db.appts.push({ id: "n-" + Date.now(), day: fs.day, bar: fs.bar, min: fs.time, dur, svc: fs.svc, cli: fs.cli.trim(), tel: (fs.tel || "").trim(), st: "agendado", src: "balcão" });
      say(`${fs.cli.trim()} encaixado: ${dayLabel(d, true).toLowerCase()}, ${hhmm(fs.time)}, com ${barber(fs.bar).nome}.`);
    }
    save(); opener = null; $("d-form").close(); render(); $("title").focus();
  });

  // ---------- global clicks ----------
  document.addEventListener("click", e => {
    const t = e.target;
    const o = t.closest("[data-open]"); if (o) { openAppt(o.dataset.open, o); return; }
    const s = t.closest("[data-st]"); if (s) { setStatus(s.dataset.id, s.dataset.st); return; }
    const n = t.closest("[data-new]"); if (n) { openForm("new", {}, n); return; }
    const bk = t.closest("[data-block]"); if (bk) { openForm("block", { bar: agBar !== "todos" ? agBar : undefined }, bk); return; }
    const f = t.closest("[data-free]"); if (f) { const [day, bar, m] = f.dataset.free.split("|"); openForm("new", { day: +day, bar, time: +m }, f); return; }
    const mv = t.closest("[data-move]"); if (mv) { const a = db.appts.find(x => x.id === mv.dataset.move); $("d-ap").close(); openForm("move", { svc: a.svc, bar: a.bar, day: a.day, except: a.id, cli: a.cli }, null); return; }
    const c = t.closest("[data-cancel]"); if (c) { const a = db.appts.find(x => x.id === c.dataset.cancel); db.appts = db.appts.filter(x => x !== a); save(); $("d-ap").close(); render(); say(`Horário de ${a.cli} cancelado. O cliente é avisado no WhatsApp.`); return; }
    const w = t.closest("[data-wa]"); if (w) { say("No sistema, abre a conversa com o cliente no WhatsApp da barbearia."); return; }
    const bl = t.closest("[data-blk]"); if (bl) {
      const x = db.blocks.find(y => y.id === bl.dataset.blk);
      $("d-ap-e").textContent = "Bloqueio"; $("d-ap-t").textContent = x.why;
      $("d-ap-b").innerHTML = `<dl class="info"><div><dt>Barbeiro</dt><dd>${esc(barber(x.bar).nome)}</dd></div><div><dt>Quando</dt><dd>${dayLabel(DAYS[x.day], true)}, ${dateTxt(DAYS[x.day])} · ${hhmm(x.min)} às ${hhmm(x.min + x.dur)}</dd></div></dl>
        <button class="btn warn" type="button" data-unblock="${x.id}">Liberar este horário</button>`;
      openD("d-ap", bl); return;
    }
    const ub = t.closest("[data-unblock]"); if (ub) { db.blocks = db.blocks.filter(y => y.id !== ub.dataset.unblock); save(); $("d-ap").close(); render(); say("Horário liberado."); return; }
    if (t.closest("[data-pend]")) { say("Benefícios e validações entram na próxima etapa do protótipo."); return; }
  });
  $("reset").addEventListener("click", () => { db = generate(); save(); render(); say("Dados de exemplo restaurados."); });
  addEventListener("storage", e => { if (e.key === APPKEY && importApp()) render(); });
  addEventListener("focus", () => { if (importApp()) render(); });

  route(false);
})();
</script>
</body>
</html>
