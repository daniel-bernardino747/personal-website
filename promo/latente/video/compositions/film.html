              <div class="r"><span>etapa</span><span>prévia · antes do pagamento</span></div>
              <div class="r"><span>data da entrega</span><span>16/11/2026</span></div>
              <div class="r"><span>trace id</span><span>A0412</span></div>
            </div>
          </div>
        </div>
      </div>

      <img id="lens-diff" src="assets/img/stage-diff.png" alt="" data-layout-allow-overlap />
      <div id="lens-ret" class="ret" data-layout-allow-overlap><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><span id="lens-tag">assinatura revelada</span></div>

      <svg id="cursor" class="clip" data-start="0.95" data-duration="5.95" viewBox="0 0 34 46">
        <path d="M2 2 L2 36 L10.5 28.5 L16.5 42 L22.5 39.4 L16.6 26.2 L28 26.2 Z" fill="#ECE6DC" stroke="#100C08" stroke-width="2.4" stroke-linejoin="round" />
      </svg>
    </div>

    <div id="cap1" class="capt clip" data-layout-allow-occlusion data-layout-allow-overlap data-start="1.7" data-duration="1.75">A foto sai idêntica</div>
    <div id="cap2" class="capt clip" data-layout-allow-occlusion data-layout-allow-overlap data-start="7.65" data-duration="2.6">Se vazar, ela diz de quem partiu</div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const RISE = "expo.out";        // entrances
    const CAM = "power2.inOut";     // camera

    // ---------- camera: the frame shows the world rect at (cx, cy) with zoom s ----------
    const cam = (cx, cy, s) => ({ x: -cx * s, y: -cy * s, scale: s });
    const F_HERO = cam(0, 0, 1), F_SEAL = cam(0, 834, 1), F_LENS = cam(461, 886, 1.6), F_TRACE = cam(25, 1055, 1.1);
    tl.set("#world", F_HERO, 0);
    tl.to("#world", { ...F_SEAL, duration: 1.0, ease: CAM }, 0);      // push down from the hero to the demo
    tl.to("#world", { ...F_LENS, duration: 0.75, ease: CAM }, 3.2);   // close in on the sealed photo
    tl.to("#world", { ...F_SEAL, duration: 0.6, ease: CAM }, 5.2);    // back out to the console
    tl.to("#world", { ...F_TRACE, duration: 0.8, ease: CAM }, 6.8);   // down to the result
    tl.to("#world", { ...F_HERO, duration: 1.6, ease: CAM }, 10.2);   // back to the hero (= frame 0)

    // ---------- cursor (world coordinates of its tip) ----------
    const P = { start: [560, 1420], seal: [315, 1330], rest: [470, 1420], go: [655, 1431], reveal: [330, 1084], out: [150, 1200] };
    tl.set("#cursor", { x: P.start[0], y: P.start[1], opacity: 1, scale: 1 }, 0.95);
    const move = (to, at, dur) => tl.to("#cursor", { x: to[0], y: to[1], duration: dur, ease: "power3.inOut" }, at);
    const click = (at, press) => {
      tl.to("#cursor", { scale: 0.84, duration: 0.05, ease: "power2.in" }, at - 0.05);
      tl.to("#cursor", { scale: 1, duration: 0.14, ease: "power2.out" }, at);
      if (press) { tl.to(press, { opacity: 0.22, duration: 0.05 }, at - 0.05); tl.to(press, { opacity: 0, duration: 0.2 }, at); }
    };
    tl.set("#band", { y: -130, opacity: 0 }, 0);
    const sweep = (at, dur) => {
      tl.set("#band", { y: -130, opacity: 1 }, at);
      tl.to("#band", { y: 340, duration: dur, ease: "power1.inOut" }, at);
      tl.set("#band", { opacity: 0 }, at + dur);
    };

    // seal: one click, the band of signature dots sweeps the photo, nothing visible changes
    move(P.seal, 1.05, 0.5);
    click(1.6, "#seal-press");
    sweep(1.65, 0.85);
    tl.set("#shot-sealed", { opacity: 1 }, 2.1);
    tl.to("#tag-0", { opacity: 0, duration: 0.15 }, 2.45);
    tl.fromTo("#tag-1", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 2.5);
    tl.to("#seal-out", { borderColor: "#2E2820", duration: 0.2 }, 2.45);
    tl.fromTo("#seal-out .r", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4, ease: RISE, stagger: 0.08 }, 2.5);
    tl.fromTo("#actions", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4, ease: RISE }, 2.75);
    move(P.rest, 1.75, 0.45);

    // the lens: the hero's reticle passes over the photo and shows the signature, amplified 60x
    const L = [[846, 990], [771, 1110], [930, 1160]];   // world centers: face, bouquet, dress
    const IMG = [596, 913];                              // the photo's top-left in the world
    const clip = (c, r) => `circle(${r}px at ${c[0] - IMG[0]}px ${c[1] - IMG[1]}px)`;
    const ret = (c) => ({ x: c[0] - 88, y: c[1] - 88 });
    tl.set("#lens-ret", ret(L[0]), 0);
    tl.fromTo("#lens-diff", { clipPath: clip(L[0], 0) }, { clipPath: clip(L[0], 85), duration: 0.45, ease: RISE }, 3.55);
    tl.fromTo("#lens-ret", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: RISE }, 3.55);
    tl.to("#lens-diff", { clipPath: clip(L[1], 85), duration: 0.6, ease: "power2.inOut" }, 4.05);
    tl.to("#lens-ret", { ...ret(L[1]), duration: 0.6, ease: "power2.inOut" }, 4.05);
    tl.to("#lens-diff", { clipPath: clip(L[2], 85), duration: 0.5, ease: "power2.inOut" }, 4.65);
    tl.to("#lens-ret", { ...ret(L[2]), duration: 0.5, ease: "power2.inOut" }, 4.65);
    tl.to("#lens-diff", { clipPath: clip(L[2], 0), duration: 0.3, ease: "power2.in" }, 5.2);
    tl.to("#lens-ret", { opacity: 0, scale: 0.8, duration: 0.3, ease: "power2.in" }, 5.2);

    // trace: open the Trace tab with the sealed photo, reveal, read the vote
    move(P.go, 5.4, 0.5);
    click(5.95, "#go-press");
    tl.to("#tab-line", { x: 535, duration: 0.35, ease: "power3.inOut" }, 5.97);
    tl.to("#t-seal .on", { opacity: 0, duration: 0.2 }, 5.97);
    tl.to("#t-trace .on", { opacity: 1, duration: 0.2 }, 5.97);
    tl.to("#t-seal", { color: "#9C9488", duration: 0.2 }, 5.97);
    tl.to("#t-trace", { color: "#ECE6DC", duration: 0.2 }, 5.97);
    tl.to(["#seal-left", "#seal-block"], { opacity: 0, duration: 0.15 }, 5.97);
    tl.to("#trace-left", { opacity: 1, duration: 0.2 }, 6.05);
    tl.to("#tag-1", { opacity: 0, duration: 0.12 }, 5.97);
    tl.to("#tag-2", { opacity: 1, duration: 0.2 }, 6.05);
    move(P.reveal, 6.08, 0.42);
    click(6.55, "#trace-press");
    sweep(6.6, 0.7);
    move(P.out, 6.65, 0.25);
    tl.to("#cursor", { opacity: 0, duration: 0.1 }, 6.8);
    tl.fromTo("#result", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: RISE }, 7.1);
    tl.to("#conf-bar", { scaleX: 1, duration: 0.6, ease: "power2.out" }, 7.25);
    tl.to("#conf-lab", { opacity: 1, duration: 0.3 }, 7.7);
    tl.fromTo("#result .readout .r", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4, ease: RISE, stagger: 0.07 }, 7.45);
    tl.to("#hit", { opacity: 1, duration: 0.35, ease: "power2.out" }, 8.25);

    // captions: one at a time
    const cap = (id, at, out) => {
      tl.fromTo(id, { opacity: 0, filter: "blur(8px)", y: 10 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.5, ease: RISE }, at);
      tl.to(id, { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, out);
    };
    cap("#cap1", 1.72, 3.12);
    cap("#cap2", 7.68, 9.95);

    tl.set({}, {}, 11.9);
    window.__timelines["film"] = tl;
  </script>
</template>
