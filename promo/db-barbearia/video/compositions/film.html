      <svg id="cursor" class="clip" data-start="0.6" data-duration="4.4" viewBox="0 0 34 46">
        <path d="M2 2 L2 36 L10.5 28.5 L16.5 42 L22.5 39.4 L16.6 26.2 L28 26.2 Z" fill="#F2F5F3" stroke="#0b1f16" stroke-width="2.4" stroke-linejoin="round" />

    <div id="cap1" class="cap clip" data-start="1.1" data-duration="3.1">O cliente agenda sozinho</div>
    <div id="cap2" class="cap clip" data-layout-allow-occlusion data-layout-allow-overlap data-start="6.85" data-duration="2.75">O dono vê na hora</div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const EASE_IN = "expo.out";      // the site's --ease, cubic-bezier(.16,1,.3,1)
    const CAM = "power2.inOut";      // camera

    // ---------- camera: frame = world rect at (cx, cy), zoom s ----------
    const cam = (cx, cy, s) => ({ x: -cx * s, y: -cy * s, scale: s });
    const F_HERO = cam(0, 0, 1), F_BOOK = cam(0, 660, 1), F_PANEL = cam(1650, 655, 1.22);
    tl.set("#world", F_HERO, 0);
    tl.to("#world", { ...F_BOOK, duration: 1.0, ease: CAM }, 0);            // beat 1: push down to the booking widget
    tl.to("#world", { ...F_PANEL, duration: 1.4, ease: CAM }, 5.2);         // beat 4: pan to the owner panel
    tl.to("#world", { ...F_HERO, duration: 1.1, ease: CAM }, 10.7);         // beat 6: back to the hero (= frame 0)

    // ---------- cursor (world coordinates of its tip) ----------
    const P = { start: [700, 1250], cabelo: [150, 752], bruno: [300, 930], hoje: [86, 1040], t1100: [350, 1134], go: [985, 1040], out: [1260, 1260] };
    tl.set("#cursor", { x: P.start[0], y: P.start[1], opacity: 1, scale: 1 }, 0.6);
    const move = (to, at, dur) => tl.to("#cursor", { x: to[0], y: to[1], duration: dur, ease: "power3.inOut" }, at);
    const click = (at) => {
      tl.to("#cursor", { scale: 0.84, duration: 0.05, ease: "power2.in" }, at - 0.05);
      tl.to("#cursor", { scale: 1, duration: 0.14, ease: "power2.out" }, at);
    };
    const on = (chip, at) => {
      tl.to(chip + " .fill", { opacity: 1, duration: 0.14, ease: "power2.out" }, at);
      tl.to(chip + " .tx", { color: "#102A1E", duration: 0.14, ease: "power2.out" }, at);
      if (document.querySelector(chip + " small")) tl.to(chip + " small", { color: "#1B3F2D", duration: 0.14, ease: "power2.out" }, at);
    };
    const fillRow = (k, at) => {
      tl.to("#d-" + k, { opacity: 0, duration: 0.12, ease: "power2.out" }, at);
      tl.fromTo("#v-" + k, { opacity: 0, filter: "blur(5px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: EASE_IN }, at + 0.03);
    };
    const label = (from, to, at) => {
      tl.to("#go-" + from, { opacity: 0, duration: 0.12, ease: "power2.out" }, at);
      tl.fromTo("#go-" + to, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, at + 0.06);
    };

    // beat 2: the client books, one click per step
    move(P.cabelo, 0.75, 0.47);
    click(1.3); on("#c-cabelo", 1.3); fillRow("svc", 1.3); fillRow("dur", 1.36); fillRow("price", 1.42); label(0, 1, 1.3);
    move(P.bruno, 1.45, 0.47);
    click(2.0); on("#c-bruno", 2.0); fillRow("bar", 2.0); label(1, 2, 2.0);
    move(P.hoje, 2.12, 0.4);
    click(2.6); on("#c-hoje", 2.6); label(2, 3, 2.6);
    tl.to("#times-msg", { opacity: 0, duration: 0.12, ease: "power2.out" }, 2.6);
    tl.fromTo("#times .chip", { opacity: 0, y: 6 }, { opacity: (i, el) => (el.classList.contains("off") ? 0.35 : 1), y: 0, duration: 0.3, ease: EASE_IN, stagger: 0.04 }, 2.64);
    move(P.t1100, 2.78, 0.34);
    click(3.2); on("#c-1100", 3.2); fillRow("when", 3.2); label(3, 4, 3.2);

    // beat 3: confirm, and the summary lifts off the page
    move(P.go, 3.4, 0.85);
    click(4.4);
    tl.to("#go-press", { opacity: 0.18, duration: 0.05 }, 4.35);
    tl.to("#go-press", { opacity: 0, duration: 0.2 }, 4.4);
    move(P.out, 4.55, 0.4);
    tl.to("#cursor", { opacity: 0, duration: 0.1 }, 4.85);
    tl.to("#sum", { scale: 1.04, boxShadow: "0 28px 60px rgba(4, 14, 9, .65)", duration: 0.32, ease: EASE_IN }, 4.45);
    // the panel folds into the appointment card it will become
    tl.to("#sum", { scale: 1, backgroundColor: "#214232", borderColor: "#8AD7B0", duration: 0.38, ease: "power3.inOut" }, 4.78);
    tl.fromTo("#sum", { clipPath: "inset(0px 0px 0px 0px)" }, { clipPath: "inset(200px 32.33px 214px 32.33px)", duration: 0.38, ease: "power3.inOut", immediateRender: false }, 4.78);
    tl.to("#sumc", { opacity: 0, filter: "blur(6px)", duration: 0.22, ease: "power2.in" }, 4.75);
    tl.fromTo("#ticket", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, 5.04);
    tl.set("#sum", { opacity: 0 }, 5.18);

    // beat 4: the card flies in an arc while the camera pans to the panel
    const T = { x: 1922.67, y: 1116 };
    tl.fromTo("#ticket", { x: 0, y: 0 }, { x: T.x - 804.33, duration: 1.4, ease: "power2.inOut" }, 5.2);
    tl.to("#ticket", { y: -170, duration: 0.55, ease: "power2.out" }, 5.2);
    tl.to("#ticket", { y: T.y - 880, duration: 0.85, ease: "power2.inOut" }, 5.75);
    tl.fromTo("#ticket", { scale: 1 }, { scale: 0.5, duration: 1.4, ease: "power2.inOut" }, 5.2);
    tl.fromTo("#ticket", { rotation: 0 }, { rotation: -3, duration: 0.55, ease: "power2.out" }, 5.2);
    tl.to("#ticket", { rotation: 0, duration: 0.85, ease: "power2.inOut" }, 5.75);
    tl.fromTo("#ticket", { boxShadow: "0 0 0 rgba(4,14,9,0)" }, { boxShadow: "0 30px 50px rgba(4,14,9,.6)", duration: 0.4, ease: "power2.out" }, 5.2);
    tl.to("#ticket", { boxShadow: "0 0 0 rgba(4,14,9,0)", duration: 0.35, ease: "power2.out" }, 6.45);

    // beat 5: it lands in Bruno's column; the day updates
    tl.fromTo("#ticket-tag", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: EASE_IN }, 6.62);
    tl.fromTo("#pulse", { y: -160, opacity: 1 }, { y: 578, opacity: 1, duration: 0.9, ease: "power1.inOut" }, 6.7);
    tl.set("#pulse", { opacity: 0 }, 7.6);
    const fmt = (v) => "R$ " + Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    const kp = { n: 65, rev: 4572, free: 32 };
    tl.to(kp, { n: 66, rev: 4632, free: 31, duration: 0.7, ease: "power2.out",
      onUpdate: () => {
        document.getElementById("k-n").textContent = Math.round(kp.n);
        document.getElementById("k-rev").textContent = fmt(kp.rev);
        document.getElementById("k-free").textContent = Math.round(kp.free);
        document.getElementById("ad-n-bruno").textContent = (kp.n >= 65.5 ? 11 : 10) + " clientes";
      } }, 6.85);
    tl.fromTo(["#k-n", "#k-rev", "#k-free"], { color: "#F2F5F3" }, { color: "#A7E3C5", duration: 0.25, ease: "power2.out" }, 6.85);
    tl.to(["#k-n", "#k-rev", "#k-free"], { color: "#F2F5F3", duration: 0.6, ease: "power2.inOut" }, 8.2);

    // off screen: the landing goes back to its empty state, so the loop and the way back are clean
    tl.set(["#steps .fill", "#times-msg"], { clearProps: "opacity" }, 8.0);
    tl.set(["#steps .tx", "#steps small"], { clearProps: "color" }, 8.0);
    tl.set("#times .chip", { opacity: 0 }, 8.0);
    tl.set(["#sum .d", "#go-0"], { opacity: 1 }, 8.0);
    tl.set(["#sum .v", "#go-1", "#go-2", "#go-3", "#go-4"], { opacity: 0 }, 8.0);
    tl.set("#sum", { opacity: 1, clipPath: "inset(0px 0px 0px 0px)", boxShadow: "none", backgroundColor: "#102A1E", borderColor: "rgba(210, 210, 210, .26)" }, 8.0);
    tl.set("#sumc", { opacity: 1, filter: "blur(0px)" }, 8.0);

    // captions: one at a time, blur in, hold, leave with a blur
    const cap = (id, at, out) => {
      tl.fromTo(id, { opacity: 0, filter: "blur(8px)", y: 10 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.5, ease: EASE_IN }, at);
      tl.to(id, { opacity: 0, filter: "blur(6px)", duration: 0.35, ease: "power2.in" }, out);
    };
    cap("#cap1", 1.15, 3.8);
    cap("#cap2", 6.9, 9.2);

    tl.set({}, {}, 11.9);
    window.__timelines["film"] = tl;
  </script>
